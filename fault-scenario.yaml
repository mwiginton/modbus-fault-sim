# Fault scenario example
# Demonstrates multiple devices, float32 registers, sine/ramp behaviors,
# and a timeline of faults: freeze_register, slow_response, connection_drop.

listen:
  host: 127.0.0.1
  port: 5020

devices:
  - unitId: 1
    name: compressor-unit
    addressBase: documentation
    registers:
      - address: 40001
        name: discharge_pressure
        type: float32
        initialValue: 7.2
        behavior:
          type: sine
          min: 5.0
          max: 9.5
          periodMs: 30000
      - address: 40003
        name: suction_pressure
        type: float32
        initialValue: 1.8
        behavior:
          type: sine
          min: 1.2
          max: 2.4
          periodMs: 45000
      - address: 40005
        name: vibration_level
        type: uint16
        initialValue: 12
        behavior:
          type: ramp
          start: 12
          end: 85
          durationMs: 600000
      - address: 40006
        name: rpm
        type: uint16
        initialValue: 3600
        behavior:
          type: constant
          value: 3600

  - unitId: 2
    name: heat-exchanger
    addressBase: documentation
    registers:
      - address: 40001
        name: inlet_temp
        type: float32
        initialValue: 45.0
        behavior:
          type: ramp
          start: 45.0
          end: 92.0
          durationMs: 180000
      - address: 40003
        name: outlet_temp
        type: float32
        initialValue: 30.5
        behavior:
          type: sine
          min: 28.0
          max: 35.0
          periodMs: 20000
      - address: 40005
        name: flow_rate
        type: uint16
        initialValue: 500
        behavior:
          type: constant
          value: 500

scenario:
  # At 10s, freeze the compressor discharge pressure at its current value
  - offsetMs: 10000
    fault: freeze_register
    target: compressor-unit.discharge_pressure
    durationMs: 30000

  # At 25s, introduce 2500ms delay on vibration reads (exceeds client 2s timeout)
  - offsetMs: 25000
    fault: slow_response
    target: compressor-unit.vibration_level
    delayMs: 2500
    durationMs: 20000

  # At 45s, drop all connections to the heat exchanger
  - offsetMs: 45000
    fault: connection_drop
    target: heat-exchanger
    durationMs: 10000

  # At 60s, freeze the heat exchanger inlet temp sensor
  - offsetMs: 60000
    fault: freeze_register
    target: heat-exchanger.inlet_temp
    durationMs: 15000

  # At 90s, introduce 2500ms delay on RPM reads (exceeds client 2s timeout)
  - offsetMs: 90000
    fault: slow_response
    target: compressor-unit.rpm
    delayMs: 2500
    durationMs: 25000
